name: Publish

on:
  workflow_dispatch:

jobs:
  # Job to extract the version
  # from the tag.
  # For instance, for a `v0.0.1`
  # tag, this job stores `0.0.1`
  # as version output.
  #
  # Remark: this job stores `none`
  # as version output on failure.
  get-version-from-tag:
    name: Get version from the tag
    runs-on: ubuntu-latest
    permissions: read-all

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Extract version from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pattern="[0-9]+\\.[0-9]+\\.[0-9]+"
            version=$(echo "${GITHUB_REF_NAME}" | sed -e "s|v||g" | grep -oP "^$pattern\$")

            if [[ $version =~ ^$pattern$ ]]; then
              echo "version=${version}" >> "${GITHUB_OUTPUT}"
            else
              echo "version=none" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "version=none" >> "${GITHUB_OUTPUT}"
          fi

  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - get-version-from-tag
    if: |
      github.actor == 'luau-project' &&
      github.triggering_actor == 'luau-project' &&
      github.repository == 'luau-project/setup-lua' &&
      github.ref_type == 'tag' &&
      needs.get-version-from-tag.outputs.version != 'none'
    env:
      TAGVERSION: ${{ needs.get-version-from-tag.outputs.version }}
      RELEASENOTES: RELEASE-NOTES.md

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Create versioned release zip and tarball
        run: |
          for ext in zip tar.gz; do
            git archive \
              --format=${ext} \
              -o setup-lua-${TAGVERSION}.${ext} \
              --prefix=setup-lua-${TAGVERSION}/ \
              ${GITHUB_REF_NAME} || {
              echo "Failed to create a release archive (${ext})"
              exit 1
            }
          done

      - name: Create release notes from the changelog
        run: |
          first_heading_line=$(grep -n -m1 "## setup-lua" CHANGELOG.md | grep -oP "^[0-9]+")
          second_heading_line=$(grep -n -m2 "## setup-lua" CHANGELOG.md | tail -n1 | grep -oP "^[0-9]+")
          sed -n "$((first_heading_line + 1)),$((second_heading_line - 1))p" CHANGELOG.md > ${RELEASENOTES}

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --notes-file ${RELEASENOTES} \
            "setup-lua-${TAGVERSION}.zip" \
            "setup-lua-${TAGVERSION}.tar.gz"